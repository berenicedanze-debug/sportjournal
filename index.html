<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Journal</title>
  <style>
    :root { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --line: #334155; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
    .card { background: var(--surface); padding: 30px; border-radius: 16px; width: 100%; max-width: 440px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); }
    h1, h2 { margin-top: 0; }
    p.muted { color: var(--muted); font-size: 0.9rem; }
    input { width: 100%; padding: 10px; margin: 8px 0 16px 0; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }
    .btn-danger { background: #ef4444; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card" id="app">
    <p>Chargement...</p>
  </div>

  <script>
    const STORAGE_KEY = 'sportjournal_user_profile';

    function render() {
      const raw = localStorage.getItem(STORAGE_KEY);
      const profile = raw ? JSON.parse(raw) : null;
      const app = document.getElementById('app');

      if (!profile || !profile.name) {
        app.innerHTML = `
          <h2>Bienvenue sur Sport Journal !</h2>
          <p class="muted">Veuillez renseigner vos informations pour personnaliser votre espace.</p>
          <form id="welcome-form">
            <label style="font-size:0.85rem; font-weight:600; color:var(--muted);">Votre Prénom ou Nom *</label>
            <input type="text" id="name" required placeholder="Ex. Julie">
            
            <label style="font-size:0.85rem; font-weight:600; color:var(--muted);">Poids actuel (kg)</label>
            <input type="number" step="0.1" id="weight" placeholder="Ex. 65">
            
            <label style="font-size:0.85rem; font-weight:600; color:var(--muted);">Objectif principal</label>
            <input type="text" id="goal" placeholder="Ex. Préparer un semi-marathon">
            
            <button type="submit">Commencer mon journal</button>
          </form>
        `;

        document.getElementById('welcome-form').onsubmit = (e) => {
          e.preventDefault();
          const newProfile = {
            name: document.getElementById('name').value.trim(),
            weight: document.getElementById('weight').value,
            goal: document.getElementById('goal').value.trim()
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(newProfile));
          render();
        };
      } else {
        app.innerHTML = `
          <h1>Bonjour ${profile.name} !</h1>
          <p class="muted">Objectif : ${profile.goal || 'Aucun objectif défini'}</p>
          <p class="muted">Poids : ${profile.weight ? profile.weight + ' kg' : 'Non renseigné'}</p>
          <hr style="border:0; border-top:1px solid var(--line); margin:20px 0;">
          <p>Votre tableau de bord est prêt à l'emploi.</p>
          <button class="btn-danger" onclick="localStorage.removeItem('${STORAGE_KEY}'); location.reload();">Réinitialiser le profil</button>
        `;
      }
    }

    render();
  </script>
</body>
</html>
