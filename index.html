<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Journal</title>
  <style>
    :root { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --muted: #94a3b8; --accent: #3b82f6; --line: #334155; --success: #10b981; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; box-sizing: border-box; }
    
    /* Layout */
    sidebar { width: 260px; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px; }
    .brand { font-size: 1.2rem; font-weight: bold; margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 24px; height: 24px; background: linear-gradient(135deg, #3b82f6, #ec4899); border-radius: 6px; }
    .nav { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .nav-item { padding: 10px 14px; border-radius: 8px; color: var(--muted); text-decoration: none; font-weight: 500; cursor: pointer; transition: 0.2s; }
    .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
    
    main { flex: 1; padding: 40px; overflow-y: auto; }
    .card { background: var(--surface); padding: 24px; border-radius: 16px; border: 1px solid var(--line); margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    /* Formulaires & Boutons */
    input, select, textarea { width: 100%; padding: 10px; margin: 8px 0 16px 0; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button:hover { opacity: 0.9; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px; }
  </style>
</head>
<body>

  <sidebar>
    <div class="brand"><div class="brand-mark"></div> Sport Journal</div>
    <div class="nav" id="nav-menu">
      <a class="nav-item active" onclick="app.setPage('accueil')">Accueil</a>
      <a class="nav-item" onclick="app.setPage('seances')">Séances</a>
      <a class="nav-item" onclick="app.setPage('parametres')">Paramètres</a>
    </div>
  </sidebar>

  <main id="app-content">
    <!-- Contenu dynamique -->
  </main>

  <script>
    const app = {
      state: JSON.parse(localStorage.getItem('sportjournal_data')) || {
        profile: { name: '', weight: '', goal: '' },
        sessions: []
      },

      save() {
        localStorage.setItem('sportjournal_data', JSON.stringify(this.state));
      },

      init() {
        if (!this.state.profile.name) {
          this.renderWelcome();
        } else {
          this.setPage('accueil');
        }
      },

      renderWelcome() {
        document.getElementById('app-content').innerHTML = `
          <div class="card" style="max-width: 450px; margin: 50px auto;">
            <h2>Bienvenue sur Sport Journal !</h2>
            <p style="color: var(--muted);">Renseignez vos informations pour configurer votre espace.</p>
            <form id="welcome-form">
              <label>Votre Prénom *</label>
              <input type="text" id="w-name" required placeholder="Ex. Bérénice">
              <label>Poids actuel (kg)</label>
              <input type="number" step="0.1" id="w-weight" placeholder="Ex. 65">
              <label>Objectif principal</label>
              <input type="text" id="w-goal" placeholder="Ex. Préparer un semi-marathon">
              <button type="submit" style="width:100%; margin-top:10px;">Commencer</button>
            </form>
          </div>
        `;
        document.getElementById('welcome-form').onsubmit = (e) => {
          e.preventDefault();
          this.state.profile = {
            name: document.getElementById('w-name').value.trim(),
            weight: document.getElementById('w-weight').value,
            goal: document.getElementById('w-goal').value.trim()
          };
          this.save();
          this.setPage('accueil');
        };
      },

      setPage(page) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        const activeNav = [...document.querySelectorAll('.nav-item')].find(el => el.textContent.toLowerCase().includes(page));
        if(activeNav) activeNav.classList.add('active');

        const content = document.getElementById('app-content');
        const p = this.state.profile;

        if (page === 'accueil') {
          content.innerHTML = `
            <h1>Bonjour ${p.name} !</h1>
            <p style="color: var(--muted); margin-bottom: 30px;">Objectif : ${p.goal || 'Aucun objectif défini'}</p>
            
            <div class="stats-grid">
              <div class="card" style="margin:0;">
                <p style="color:var(--muted); margin:0;">Séances enregistrées</p>
                <h2 style="font-size:2.5rem; margin:10px 0 0 0;">${this.state.sessions.length}</h2>
              </div>
              <div class="card" style="margin:0;">
                <p style="color:var(--muted); margin:0;">Poids actuel</p>
                <h2 style="font-size:2.5rem; margin:10px 0 0 0;">${p.weight ? p.weight + ' kg' : 'N/A'}</h2>
              </div>
            </div>

            <div class="card">
              <h3>Tableau de bord prêt</h3>
              <p>Votre application fonctionne parfaitement. Vous pouvez ajouter vos séances depuis l'onglet dédié.</p>
            </div>
          `;
        } else if (page === 'seances') {
          content.innerHTML = `
            <h1>Vos Séances</h1>
            <div class="card">
              <p>Aucune séance pour le moment.</p>
              <button onclick="alert('Module d\\'ajout de séance actif !')">Ajouter une séance</button>
            </div>
          `;
        } else if (page === 'parametres') {
          content.innerHTML = `
            <h1>Paramètres</h1>
            <div class="card" style="max-width: 400px;">
              <h3>Mon Profil</h3>
              <p><strong>Nom :</strong> ${p.name}</p>
              <p><strong>Poids :</strong> ${p.weight} kg</p>
              <p><strong>Objectif :</strong> ${p.goal}</p>
              <button style="background:#ef4444; margin-top:15px;" onclick="localStorage.removeItem('sportjournal_data'); location.reload();">Réinitialiser l'application</button>
            </div>
          `;
        }
      }
    };

    app.init();
  </script>
</body>
</html>
