<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : l'app occupe tout l'écran des téléphones à encoche -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sport Journal</title>
  <meta name="description" content="Carnet d'entraînement personnel, privé et hors ligne.">
  <meta name="theme-color" content="#2F57F0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <!-- Menu latéral (ordinateur) : rempli par app.js -->
    <aside class="sidebar" aria-label="Navigation principale">
      <div class="brand"><span class="brand-mark"></span>Sport Journal</div>
      <nav id="nav-side" class="nav">
        <!-- Liens intégrés directement pour garantir leur affichage instantané -->
        <a href="#accueil" class="nav-link">🏠 Accueil</a>
        <a href="#calendrier" class="nav-link">📅 Calendrier</a>
        <a href="#statistiques" class="nav-link">📊 Statistiques</a>
      </nav>
      <button id="theme-btn" class="btn btn-ghost" type="button">🌓 Thème</button>
    </aside>

    <!-- Zone de contenu : chaque page est rendue ici (ID corrigé en "app" pour correspondre au routeur) -->
    <main id="app" class="view" tabindex="-1"></main>

    <!-- Barre du bas (mobile) -->
    <nav id="nav-tab" class="tabbar" aria-label="Navigation mobile">
      <a href="#accueil" class="nav-link">
        <span>🏠</span>
        <span>Accueil</span>
      </a>
      <a href="#calendrier" class="nav-link">
        <span>📅</span>
        <span>Calendrier</span>
      </a>
      <a href="#statistiques" class="nav-link">
        <span>📊</span>
        <span>Stats</span>
      </a>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
