<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Journal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"></div>
        <span>Sport Journal</span>
      </div>
      <nav class="nav" id="nav-side"></nav>
      <button type="button" class="btn btn-ghost" id="theme-btn" style="width: 100%; justify-content: flex-start; margin-top: auto;"></button>
    </aside>

    <main class="view" id="view" tabindex="-1"></main>

    <nav class="tabbar" id="nav-tab" aria-label="Navigation mobile"></nav>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
